[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinball-jax"
version = "0.1.0"
description = "JAX implementation of the Pinball reinforcement learning environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pinball_jax"]
